services:
  postgres:
    image: postgres:15-alpine
    container_name: emms_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-emms_dev}
    ports:
      - '5433:5432'
    volumes:
      - emms_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: emms_redis
    ports:
      - '6379:6379'
    volumes:
      - emms_redisdata:/data
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning

volumes:
  emms_pgdata:
  emms_redisdata:
